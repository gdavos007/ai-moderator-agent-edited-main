version: '3.8'
services:
  agent:
    build: .
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./src:/app/src
      - ./topic_questions:/app/topic_questions
      - ./surveys_config.yaml:/app/surveys_config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build: 
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8083:8080"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderator_agent}
      POSTGRES_USER: ${POSTGRES_USER:-moderator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
