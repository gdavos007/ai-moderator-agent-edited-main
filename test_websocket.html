<!DOCTYPE html>
<html>
<head>
    <title>Websocket Test</title>
</head>
<body>
    <h1>Websocket Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="log"></div>

    <script>
        const wsUrl = 'wss://grainier-euna-occupiedly.ngrok-free.dev/ws/audio';
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        log.innerHTML += `<p>Attempting to connect to: ${wsUrl}</p>`;

        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            status.textContent = 'Connected! ✅';
            status.style.color = 'green';
            log.innerHTML += '<p>✅ Websocket connection established!</p>';

            // Send test message
            ws.send(JSON.stringify({
                event: 'test',
                data: { message: 'Hello from browser' }
            }));
        };

        ws.onerror = (error) => {
            status.textContent = 'Error ❌';
            status.style.color = 'red';
            log.innerHTML += `<p>❌ Error: ${error}</p>`;
        };

        ws.onclose = (event) => {
            status.textContent = 'Disconnected';
            log.innerHTML += `<p>Disconnected: ${event.code} - ${event.reason}</p>`;
        };

        ws.onmessage = (event) => {
            log.innerHTML += `<p>📨 Received: ${event.data}</p>`;
        };
    </script>
</body>
</html>
