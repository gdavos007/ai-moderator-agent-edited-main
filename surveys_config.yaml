# Configuration Fields:
# - name (REQUIRED): Display name for the survey
# - questions_file (REQUIRED): Path to questions JSON file (relative to project root)
# - welcome_message (OPTIONAL): Custom welcome message for participants
# - response_output_dir (OPTIONAL): Output directory for responses (default: "output")
# - enabled (OPTIONAL): Enable/disable survey without removing config (default: true)
